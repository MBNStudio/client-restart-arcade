name: Déploiement GitHub Pages

# Les propositions de refonte vivent chacune sur une branche theme-* du même dépôt.
# Le workflow de main construit toutes les versions et publie le site complet :
# un push ici relance simplement ce déploiement.
on:
  push:
    branches: ['theme-*']

permissions:
  actions: write

jobs:
  relancer:
    runs-on: ubuntu-latest
    steps:
      - name: Relancer le déploiement de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
